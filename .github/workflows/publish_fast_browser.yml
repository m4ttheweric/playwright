name: Publish Fast Browser artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'fast-browser-v')
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - run: npm ci
    - run: npx playwright install chromium
    - run: npm run build
    - name: Derive version
      id: version
      run: echo "value=${GITHUB_REF_NAME#fast-browser-v}" >> "$GITHUB_OUTPUT"
    - run: node utils/fast_browser/build_artifacts.mjs --version "${{ steps.version.outputs.value }}" --out-dir fast-browser-dist
    - env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" fast-browser-dist/* --clobber
